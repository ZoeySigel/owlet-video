name: owlet-cache-validation

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cache_validation
      MYSQL_USER: cache_validation
      MYSQL_PASSWORD: cache-validation-local-password
      MYSQL_ROOT_PASSWORD: cache-validation-local-root-password
    command:
      - --innodb-buffer-pool-size=268435456
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - target: 3306
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - mysql-cache-validation:/var/lib/mysql
    cpus: 2.0
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user=cache_validation --password=cache-validation-local-password
          --database=cache_validation --execute='SELECT 1' >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 15s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - target: 6379
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - redis-cache-validation:/data
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mysql-cache-validation:
  redis-cache-validation:
