name: Deploy production
on:
  workflow_dispatch:
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Linux binary
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../artifact/bin/owlet-video .
      - name: Build static frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Package release
        run: |
          mkdir -p artifact/web
          cp -a frontend/out/. artifact/web/
          tar -C artifact -czf release.tar.gz bin web
      - name: Deploy via restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.DEPLOY_KEY_PASSPHRASE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/askpass <<'EOF'
          #!/bin/sh
          printf '%s' "$DEPLOY_KEY_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/id_ed25519 </dev/null
          unset DEPLOY_KEY_PASSPHRASE
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes owlet-video-ci@"$DEPLOY_HOST" "deploy $GITHUB_SHA" < release.tar.gz
